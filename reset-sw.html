<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mochi · 更新到最新版</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:rgba(18,18,22,.62); padding:22px;
    font-family:"Mochi Serif","Noto Serif SC","Songti SC","STSong","SimSun",serif;
    -webkit-tap-highlight-color:transparent;
  }
  .popup {
    width:100%; max-width:292px; background:#fff; border-radius:17px; padding:19px 18px 15px;
    box-shadow:0 24px 70px rgba(0,0,0,.35); text-align:center;
    animation:pop .18s ease-out;
  }
  @keyframes pop { from { transform:scale(.95); opacity:0; } to { transform:scale(1); opacity:1; } }
  .ico {
    width:38px; height:38px; margin:0 auto 11px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:#f2ede4; color:#1f1f1f; font-size:18px;
  }
  h1 { margin:0 0 6px; font-size:17px; letter-spacing:.03em; color:#1c1c1c; }
  p { margin:0 0 14px; font-size:12px; line-height:1.75; color:#777; }
  p b { color:#1f1f1f; }
  .btn {
    width:100%; padding:11px; border:none; border-radius:12px; cursor:pointer;
    background:#1f1f1f; color:#fff; font-size:13.5px; font-weight:600; font-family:inherit;
    letter-spacing:.04em;
  }
  .btn:active { opacity:.82; }
  .btn[disabled] { opacity:.55; cursor:default; }
  .btn.ghost { margin-top:7px; background:transparent; color:#999; font-weight:400; font-size:12px; padding:6px; }
  #status { min-height:16px; margin-top:8px; font-size:11.5px; color:#8a6d3b; line-height:1.6; }
</style>
</head>
<body>
  <div class="popup" role="dialog" aria-modal="true" aria-labelledby="t">
    <div class="ico">✦</div>
    <h1 id="t">发现新版本</h1>
    <p>需要清理一次旧网页缓存才能更新。<br><b>不会删除聊天、字卡或任何本地数据。</b></p>
    <button class="btn" id="go" type="button">立即更新到最新版</button>
    <button class="btn ghost" id="later" type="button">稍后</button>
    <div id="status"></div>
  </div>
<script>
(function () {
  var statusEl = document.getElementById('status');
  var goBtn = document.getElementById('go');
  var laterBtn = document.getElementById('later');
  var busy = false;

  function setStatus(t) { statusEl.textContent = t; }
  // 某些手机浏览器里 unregister / caches.delete 会长时间不返回；加超时保证一定继续。
  function timeout(p, ms, fallback) {
    return Promise.race([p, new Promise(function (resolve) {
      setTimeout(function () { resolve(fallback); }, ms);
    })]);
  }
  function goLatest() {
    setStatus('正在打开最新版…');
    setTimeout(function () {
      location.replace('./?updated=' + Date.now());
    }, 400);
  }

  async function update() {
    if (busy) return;
    busy = true;
    goBtn.disabled = true;
    laterBtn.disabled = true;
    setStatus('正在清理旧缓存…');
    try {
      if ('serviceWorker' in navigator) {
        var regs = await timeout(navigator.serviceWorker.getRegistrations(), 2500, []);
        await timeout(Promise.all(regs.map(function (r) { return r.unregister(); })), 2500, []);
      }
    } catch (e) {}
    try {
      if (window.caches) {
        var keys = await timeout(caches.keys(), 2500, []);
        await timeout(Promise.all(keys.map(function (k) { return caches.delete(k); })), 4000, []);
      }
    } catch (e) {}
    // 再确认一次：服务器当前返回的 index 是否已经是新版（牌阵 UI 的标记）。
    var fresh = true;
    try {
      var res = await timeout(fetch('./index.html?probe=' + Date.now(), { cache: 'no-store' }), 4000, null);
      if (res && res.ok) {
        var html = await timeout(res.text(), 3000, '');
        if (html && html.indexOf('div-spread-select') === -1) fresh = false;
      }
    } catch (e) {}
    if (!fresh) {
      setStatus('服务器返回的仍是旧版页面，可能是网络缓存。请换 WiFi / 流量再点一次，或等 1 分钟后重试。');
      busy = false;
      goBtn.disabled = false;
      laterBtn.disabled = false;
      goBtn.textContent = '再试一次';
      return;
    }
    goLatest();
  }

  goBtn.addEventListener('click', update);
  laterBtn.addEventListener('click', function () {
    location.replace('./');
  });
})();
</script>
</body>
</html>
