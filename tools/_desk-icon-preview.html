<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:18px;background:#efece7;font-family:sans-serif}
h2{font-size:14px;margin:10px 0 8px;color:#333}
.row-wrap{display:flex;gap:14px;flex-wrap:wrap}
.set-row-mock{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:10px 14px;min-width:230px}
.set-row-mock .ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.set-row-mock .ico svg{width:20px;height:20px}
.set-row-mock .txt{font-size:14px;color:#222}
.set-row-mock .tk{width:34px;height:20px;border-radius:10px;background:#d8d4cd;display:inline-block;position:relative}
.set-row-mock .tk::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.zooms{display:flex;gap:12px;margin-top:10px;align-items:flex-start}
.zoom{width:104px;display:flex;flex-direction:column;align-items:center;gap:5px}
.zoom .box{width:104px;height:104px;background:#fff;border:1px dashed #bbb;display:flex;align-items:center;justify-content:center}
.zoom svg{width:88px;height:88px}
.zoom .nm{font-size:11.5px;color:#444;font-weight:700;text-align:center}
</style></head><body>

<h2>联系人跨桌面查岗</h2>
<div class="row-wrap" id="rows-a"></div>
<div class="zooms" id="zooms-a"></div>

<h2>联系人跨桌面打电话</h2>
<div class="row-wrap" id="rows-b"></div>
<div class="zooms" id="zooms-b"></div>

<script>
const OLD_CHECKIN = '<path d="M12 21a9 9 0 1 0-9-9"/><path d="M12 12l3.4-2.8"/><circle cx="7.4" cy="7.4" r="1.05" fill="#111111" stroke="none"/><g transform="translate(4.9,3.5) scale(0.52)"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></g>';
const OLD_CALL = '<circle cx="12" cy="12" r="7" stroke-dasharray="2 3"/><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>';
const HANDSET = '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>';

// 查岗候选
const A = [
  { n: '旧版', s: OLD_CHECKIN },
  // A1 表盘 + 右上迷你手机角标
  { n: 'A1 表盘+手机角标', s: '<circle cx="10" cy="14" r="6.5"/><path d="M10 10.8v3.2l2.2 1.3"/><rect x="16.2" y="2" width="5.8" height="8.2" rx="1.7"/>' },
  // A2 手机轮廓内表针
  { n: 'A2 手机内表针', s: '<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M12 7.5v4l2.6 1.6"/><path d="M10.2 18.7h3.6"/>' },
  // A3 表盘 + 带home线手机角标
  { n: 'A3 角标带home线', s: '<circle cx="10" cy="14" r="6.5"/><path d="M10 10.8v3.2l2.2 1.3"/><rect x="16.2" y="2" width="5.8" height="8.2" rx="1.7"/><path d="M18.2 8.4h2.2"/>' },
];
// 打电话候选
const B = [
  { n: '旧版', s: OLD_CALL },
  // B1 听筒 + 右上迷你手机角标
  { n: 'B1 听筒+手机角标', s: HANDSET + '<rect x="16.2" y="2" width="5.8" height="8.2" rx="1.7"/>' },
  // B2 手机轮廓内迷你听筒
  { n: 'B2 手机内听筒', s: '<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><g transform="translate(6.72,6.72) scale(0.44)">' + HANDSET + '</g>' },
  // B3 听筒 + 带home线手机角标
  { n: 'B3 角标带home线', s: HANDSET + '<rect x="16.2" y="2" width="5.8" height="8.2" rx="1.7"/><path d="M18.2 8.4h2.2"/>' },
];

function svg(inner) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
}
function fill(id, list, label) {
  const rows = document.getElementById(id + '-rows') || document.getElementById(id);
  rows.innerHTML = list.map(c =>
    '<div class="set-row-mock"><div class="ico">' + svg(c.s) + '</div><div class="txt">' + label + '</div><span class="tk"></span></div>'
  ).join('');
  document.getElementById(id === 'rows-a' ? 'zooms-a' : 'zooms-b').innerHTML = list.map(c =>
    '<div class="zoom"><div class="box">' + svg(c.s) + '</div><div class="nm">' + c.n + '</div></div>'
  ).join('');
}
fill('rows-a', A, '联系人跨桌面查岗');
fill('rows-b', B, '联系人跨桌面打电话');
</script>
</body></html>
