<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:20px;background:#efece7;font-family:sans-serif}
.sec{margin:0 0 26px}
.sec h2{margin:0 0 10px;font-size:14px;color:#333;font-weight:700}
.row{display:flex;gap:24px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:8px;width:120px;padding:10px;border-radius:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.col.rec{outline:2px solid #4caf50;outline-offset:-2px}
.tile{width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.97);
  border:1px solid rgba(0,0,0,.1);box-shadow:0 2px 8px rgba(0,0,0,.06);
  display:flex;align-items:center;justify-content:center}
.tile svg{width:23px;height:23px;color:#444}
.name{font-size:12px;font-weight:700;color:#222}
.tag{font-size:10px;color:#999}
.zoom{width:100px;height:100px;background:#fff;border:1px dashed #bbb;display:flex;align-items:center;justify-content:center;margin-top:2px}
.zoom svg{width:84px;height:84px;color:#333}
.old .tile,.old .zoom{background:#faf7f2}
</style></head><body>

  <div class="sec">
    <h2>钓鱼 — 选一个（A 为推荐）</h2>
    <div class="row">
      <div class="col rec">
        <div class="name">A · 一条鱼</div>
        <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 8.8l4.2-3.3"/><path d="M17.8 16.2l4.2 3.3"/><ellipse cx="10.6" cy="12.5" rx="7.2" ry="4.3"/><circle cx="7.2" cy="11.3" r=".6" fill="currentColor" stroke="none"/><path d="M3 5.2q1.7-1.1 3.4 0q1.7-1.1 3.4 0q1.7-1.1 3.4 0"/></svg></div>
        <div class="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 8.8l4.2-3.3"/><path d="M17.8 16.2l4.2 3.3"/><ellipse cx="10.6" cy="12.5" rx="7.2" ry="4.3"/><circle cx="7.2" cy="11.3" r=".6" fill="currentColor" stroke="none"/><path d="M3 5.2q1.7-1.1 3.4 0q1.7-1.1 3.4 0q1.7-1.1 3.4 0"/></svg></div>
        <div class="tag">椭圆鱼身+V尾+水波</div>
      </div>
      <div class="col">
        <div class="name">B · 鱼钩</div>
        <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5v8.2a4.9 4.9 0 0 1-9.8 0V9"/><path d="M7.2 9l-1.9 1.2"/><path d="M6 21q1.5-1.1 3 0q1.5-1.1 3 0q1.5-1.1 3 0"/></svg></div>
        <div class="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5v8.2a4.9 4.9 0 0 1-9.8 0V9"/><path d="M7.2 9l-1.9 1.2"/><path d="M6 21q1.5-1.1 3 0q1.5-1.1 3 0q1.5-1.1 3 0"/></svg></div>
        <div class="tag">J形钩+倒刺+水波</div>
      </div>
      <div class="col">
        <div class="name">C · 鱼竿</div>
        <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5l9 5.6"/><path d="M14 10.1v6.4"/><path d="M8 20.5q1.7-1.2 3.4 0q1.7-1.2 3.4 0q1.7-1.2 3.4 0"/></svg></div>
        <div class="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5l9 5.6"/><path d="M14 10.1v6.4"/><path d="M8 20.5q1.7-1.2 3.4 0q1.7-1.2 3.4 0q1.7-1.2 3.4 0"/></svg></div>
        <div class="tag">鱼竿+线+水波</div>
      </div>
    </div>
  </div>

  <div class="sec">
    <h2>扫雷 — 选一个（A 为推荐）</h2>
    <div class="row">
      <div class="col rec">
        <div class="name">A · 雷区</div>
        <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/><circle cx="12" cy="12" r="2.3"/></svg></div>
        <div class="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/><circle cx="12" cy="12" r="2.3"/></svg></div>
        <div class="tag">3×3雷区方格+中心雷</div>
      </div>
      <div class="col">
        <div class="name">B · 圆雷+火花</div>
        <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="13" r="4.3"/><path d="M13.4 9.6l3.1-3.1"/><path d="M18.8 4.5h3.4"/><path d="M20.5 2.8v3.4"/></svg></div>
        <div class="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="13" r="4.3"/><path d="M13.4 9.6l3.1-3.1"/><path d="M18.8 4.5h3.4"/><path d="M20.5 2.8v3.4"/></svg></div>
        <div class="tag">地雷+右上火花（经典）</div>
      </div>
      <div class="col">
        <div class="name">C · 探雷旗</div>
        <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 21V3.5"/><path d="M4.5 4.5h10l-2.4 3.4 2.4 3.4H4.5z"/></svg></div>
        <div class="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 21V3.5"/><path d="M4.5 4.5h10l-2.4 3.4 2.4 3.4H4.5z"/></svg></div>
        <div class="tag">插旗标记雷</div>
      </div>
    </div>
  </div>

  <div class="sec">
    <h2>记忆翻牌 — 选一个（A 为推荐）</h2>
    <div class="row">
      <div class="col rec">
        <div class="name">A · 叠卡</div>
        <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.6 3.4l8.8-2 3.4 3.2-8.8 2z"/><rect x="3.4" y="7" width="15.6" height="13.4" rx="1.8"/><path d="M11.2 11.8l.9 1.9 1.9.9-1.9.9-.9 1.9-.9-1.9-1.9-.9 1.9-.9z"/></svg></div>
        <div class="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.6 3.4l8.8-2 3.4 3.2-8.8 2z"/><rect x="3.4" y="7" width="15.6" height="13.4" rx="1.8"/><path d="M11.2 11.8l.9 1.9 1.9.9-1.9.9-.9 1.9-.9-1.9-1.9-.9 1.9-.9z"/></svg></div>
        <div class="tag">倾斜背卡+正卡+星</div>
      </div>
      <div class="col">
        <div class="name">B · 一盖一翻</div>
        <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.4" y="5" width="8" height="13.6" rx="1.7"/><rect x="12.6" y="5" width="8" height="13.6" rx="1.7"/><path d="M5.5 6.8l4.6 4.6M10.1 6.8l-4.6 4.6"/><path d="M16.6 10l.9 1.8 1.8.9-1.8.9-.9 1.8-.9-1.8-1.8-.9 1.8-.9z"/></svg></div>
        <div class="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.4" y="5" width="8" height="13.6" rx="1.7"/><rect x="12.6" y="5" width="8" height="13.6" rx="1.7"/><path d="M5.5 6.8l4.6 4.6M10.1 6.8l-4.6 4.6"/><path d="M16.6 10l.9 1.8 1.8.9-1.8.9-.9 1.8-.9-1.8-1.8-.9 1.8-.9z"/></svg></div>
        <div class="tag">背面卡+正面星卡</div>
      </div>
      <div class="col">
        <div class="name">C · 单卡折角</div>
        <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="4" width="14.6" height="16.2" rx="1.8"/><path d="M15.5 4v4a1.8 1.8 0 0 0 1.8 1.8h2.9"/><path d="M15.5 4l4.7 5.8"/><path d="M11 11.2l.9 1.8 1.8.9-1.8.9-.9 1.8-.9-1.8-1.8-.9 1.8-.9z"/></svg></div>
        <div class="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="4" width="14.6" height="16.2" rx="1.8"/><path d="M15.5 4v4a1.8 1.8 0 0 0 1.8 1.8h2.9"/><path d="M15.5 4l4.7 5.8"/><path d="M11 11.2l.9 1.8 1.8.9-1.8.9-.9 1.8-.9-1.8-1.8-.9 1.8-.9z"/></svg></div>
        <div class="tag">单卡折角+星（近原版）</div>
      </div>
    </div>
  </div>

  <div class="sec">
    <h2>原版（当前线上样式，用于对比）</h2>
    <div class="row">
      <div class="col old">
        <div class="name">钓鱼·原</div>
        <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 3l-3.2.6c-2 .4-3.8 1.4-5.3 2.9-1.4 1.4-2.4 3.2-3 5.1L4.5 16.5"/><path d="M19 3c-.4 2.8.5 5.6 2.4 7.5"/><path d="M8 14.5a2.3 2.3 0 115.3 0 6 6 0 01-4.8 5c0-1 .2-3 .4-4.5l-.9-.5z"/><path d="M11.5 15l-.9-2.4M7 16.8l1.4-1.2"/></svg></div>
        <div class="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 3l-3.2.6c-2 .4-3.8 1.4-5.3 2.9-1.4 1.4-2.4 3.2-3 5.1L4.5 16.5"/><path d="M19 3c-.4 2.8.5 5.6 2.4 7.5"/><path d="M8 14.5a2.3 2.3 0 115.3 0 6 6 0 01-4.8 5c0-1 .2-3 .4-4.5l-.9-.5z"/><path d="M11.5 15l-.9-2.4M7 16.8l1.4-1.2"/></svg></div>
      </div>
      <div class="col old">
        <div class="name">扫雷·原</div>
        <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="10" cy="14" r="4"/><path d="M13.2 10.8L15.5 8.5"/><path d="M17.5 5.5h3"/><path d="M19 4v3"/></svg></div>
        <div class="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="10" cy="14" r="4"/><path d="M13.2 10.8L15.5 8.5"/><path d="M17.5 5.5h3"/><path d="M19 4v3"/></svg></div>
      </div>
      <div class="col old">
        <div class="name">记忆·原</div>
        <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="12.5" height="17" rx="2"/><path d="M9.5 2.5H19a2 2 0 012 2v14"/><path d="M9.25 12.6l1.05 2.15 2.15 1.05-2.15 1.05-1.05 2.15-1.05-2.15-2.15-1.05 2.15-1.05z"/></svg></div>
        <div class="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="12.5" height="17" rx="2"/><path d="M9.5 2.5H19a2 2 0 012 2v14"/><path d="M9.25 12.6l1.05 2.15 2.15 1.05-2.15 1.05-1.05 2.15-1.05-2.15-2.15-1.05 2.15-1.05z"/></svg></div>
      </div>
    </div>
  </div>
</body></html>
