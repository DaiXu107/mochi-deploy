<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:20px;background:#efece7;font-family:sans-serif}
.sec{margin:0 0 26px}
.sec h2{margin:0 0 4px;font-size:14px;color:#333;font-weight:700}
.sec .sub{margin:0 0 10px;font-size:11px;color:#999}
.row{display:flex;gap:20px;flex-wrap:wrap}
.pair{display:flex;gap:12px}
.col{display:flex;flex-direction:column;align-items:center;gap:8px;width:118px;padding:10px;border-radius:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.col.rec{outline:2px solid #4caf50;outline-offset:-2px}
.tile{width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.97);
  border:1px solid rgba(0,0,0,.1);box-shadow:0 2px 8px rgba(0,0,0,.06);
  display:flex;align-items:center;justify-content:center}
.tile svg{width:23px;height:23px;color:#444}
.name{font-size:12px;font-weight:700;color:#222}
.tag{font-size:10px;color:#999;text-align:center}
.zoom{width:96px;height:96px;background:#fff;border:1px dashed #bbb;display:flex;align-items:center;justify-content:center}
.zoom svg{width:80px;height:80px;color:#333}
.old .tile,.old .zoom{background:#faf7f2}
.lbl{font-size:10px;font-weight:700;color:#8a8a8a;margin-top:2px}
