<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>花园 · Herbarium 预览</title>
<style>
@font-face {
  font-family: "Mochi Serif";
  src: url("../../assets/fonts/MochiSerif-Regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
:root{
  --paper:#F1EDE3;
  --paper-2:#F8F5EC;
  --paper-3:#E8E2D4;
  --ink:#2B2B24;
  --ink-2:#4E4C41;
  --muted:#74705F;
  --faint:rgba(43,43,36,.42);
  --line:rgba(43,43,36,.20);
  --line-soft:rgba(43,43,36,.11);
  --sage:#77836D;
  --moss:#4F5B48;
  --rose:#B37778;
  --terra:#B05F45;
  --brass:#A98452;
  --brass-soft:rgba(169,132,82,.42);
  --serif:"Times New Roman","Mochi Serif","Songti SC","SimSun",serif;
  --sans:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#DED8CB;
  color:var(--ink);
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
  display:grid;
  place-items:center;
  min-height:100dvh;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{
  position:relative;
  width:min(100vw,430px);
  height:min(100dvh,900px);
  overflow:hidden;
  background:var(--paper);
  isolation:isolate;
}
/* ---------- 场景：玻璃温室 + 石灰岩铺地，全部由 CSS/SVG 绘制 ---------- */
.scene{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.scene::before{
  content:"";
  position:absolute;inset:0;
  background:
    radial-gradient(120% 62% at 18% -8%, rgba(255,252,241,.96) 0 18%, rgba(255,252,241,0) 58%),
    radial-gradient(90% 55% at 88% 8%, rgba(228,235,221,.48), transparent 68%),
    linear-gradient(180deg,#F6F2E8 0%,#F1EDE3 34%,#ECE7DB 64%,#E7E1D3 100%);
}
.scene .house{position:absolute;left:0;right:0;top:0;width:100%;height:280px;opacity:.9}
.scene .paving{
  position:absolute;left:-6%;right:-6%;top:30%;bottom:-8%;
  opacity:.7;
  background-image:
    linear-gradient(rgba(82,74,58,.075) 1px,transparent 1px),
    linear-gradient(90deg,rgba(82,74,58,.065) 1px,transparent 1px),
    linear-gradient(rgba(82,74,58,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(82,74,58,.03) 1px,transparent 1px);
  background-size:76px 58px,76px 58px,38px 29px,38px 29px;
  background-position:0 0,0 0,18px 13px,18px 13px;
  transform:perspective(700px) rotateX(18deg);
  transform-origin:50% 0;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 18%,#000 76%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0%,#000 18%,#000 76%,transparent 100%);
}
.scene .sun{
  position:absolute;right:34px;top:122px;width:104px;height:104px;border-radius:50%;
  border:1px solid rgba(169,132,82,.22);
  background:radial-gradient(circle at 42% 38%,rgba(255,250,232,.6),rgba(255,250,232,0) 66%);
}
.scene .sun::after{
  content:"";position:absolute;left:50%;top:50%;width:1px;height:150px;
  background:linear-gradient(180deg,rgba(169,132,82,.18),transparent);
  transform:translate(-50%,-50%) rotate(28deg);
}
.scene .sprig{position:absolute;opacity:.34;color:var(--sage)}
.scene .sprig.left{left:-28px;bottom:84px;width:150px;height:260px;transform:rotate(-6deg)}
.scene .sprig.right{right:-34px;top:206px;width:132px;height:230px;transform:scaleX(-1) rotate(8deg)}
.scene .grain{
  position:absolute;inset:0;opacity:.3;mix-blend-mode:multiply;
  background-image:repeating-linear-gradient(0deg,rgba(90,80,60,.026) 0 1px,transparent 1px 3px);
}
.scene .frame{
  position:absolute;inset:11px;border:1px solid rgba(43,43,36,.10);
}
.scene .frame::before,.scene .frame::after{
  content:"+";position:absolute;font:10px/1 var(--sans);color:rgba(43,43,36,.30)
}
.scene .frame::before{left:-5px;top:-7px}
.scene .frame::after{right:-5px;bottom:-7px}
/* ---------- 顶栏 ---------- */
.top{position:relative;z-index:4;padding:calc(15px + env(safe-area-inset-top)) 18px 0}
.top-row{display:flex;align-items:flex-start;gap:10px}
.back{
  width:32px;height:32px;margin:1px 0 0 -7px;display:grid;place-items:center;
  color:var(--ink);opacity:.82;
}
.back svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.35;fill:none}
.title{flex:1;min-width:0}
.eyebrow{
  display:block;font:600 7px/1 var(--sans);letter-spacing:.26em;color:var(--faint);
  text-transform:uppercase;
}
.title h1{
  margin:5px 0 0;font:400 25px/1 var(--serif);letter-spacing:.08em;color:var(--ink);
}
.title h1 em{font-style:normal;color:var(--brass)}
.top-meta{
  text-align:right;font:400 8px/1.8 var(--sans);letter-spacing:.12em;color:var(--muted);
  padding-top:2px;white-space:nowrap;
}
.top-meta b{display:block;font:400 11px/1.3 var(--serif);letter-spacing:.1em;color:var(--ink-2)}
.level{display:flex;align-items:center;gap:10px;margin:16px 0 0}
.level .lv{font:600 7px/1 var(--sans);letter-spacing:.18em;color:var(--muted)}
.level .track{flex:1;height:1px;background:var(--line);position:relative}
.level .track i{position:absolute;left:0;top:0;height:1px;width:71%;background:var(--brass)}
.level .track i::after{
  content:"";position:absolute;right:-3px;top:-2.5px;width:6px;height:6px;
  background:var(--brass);transform:rotate(45deg);
}
.level .exp{font:400 8px/1 var(--sans);letter-spacing:.1em;color:var(--faint)}
/* ---------- 页签 ---------- */
.tabs{
  display:flex;gap:0;margin:13px -18px 0;padding:0 18px;
  border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  position:relative;flex:0 0 auto;padding:0 10px 9px;font:400 11px/1 var(--serif);
  letter-spacing:.1em;color:var(--muted);white-space:nowrap;
}
.tab:first-child{padding-left:0}
.tab.on{color:var(--ink)}
.tab.on::after{
  content:"";position:absolute;left:0;right:10px;bottom:-1px;height:1px;background:var(--ink);
}
.tab.on:first-child::after{left:1px}
.tab small{display:block;margin-top:3px;font:600 6px/1 var(--sans);letter-spacing:.16em;opacity:.45}
/* ---------- 今日 ---------- */
.daily{
  display:flex;align-items:center;gap:0;margin:0 -18px;padding:9px 18px 8px;
  border-bottom:1px solid var(--line-soft);color:var(--muted);
  font:400 9px/1 var(--sans);letter-spacing:.04em;white-space:nowrap;
}
.daily .lbl{font-weight:600;font-size:7px;letter-spacing:.2em;color:var(--brass);margin-right:10px}
.daily .task{display:flex;align-items:center;gap:5px;padding:0 9px;border-left:1px solid var(--line-soft)}
.daily .task:first-of-type{border-left:0;padding-left:0}
.daily .dot{width:4px;height:4px;border-radius:50%;background:var(--sage)}
.daily .dot.rose{background:var(--rose)}
.daily .dot.brass{background:var(--brass)}
.daily b{font-weight:400;color:var(--ink-2)}
/* ---------- 花圃 ---------- */
.garden{
  position:relative;z-index:3;
  margin:0 16px;
  padding-top:62px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(4,1fr);
  gap:2px 4px;
  height:calc(100% - 196px - 106px);
}
.plot{
  position:relative;min-width:0;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding-top:6px;border-radius:12px;
  -webkit-tap-highlight-color:transparent;
}
.plot .no{
  position:absolute;left:5px;top:1px;font:600 6px/1 var(--sans);letter-spacing:.12em;
  color:rgba(43,43,36,.34);z-index:2;
}
.plot .pot{
  position:relative;width:92px;height:92px;border-radius:50%;
  background:
    linear-gradient(150deg,#DCD2BF 0%,#CBBFA9 42%,#B7AA93 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.55) inset,
    0 8px 12px -6px rgba(58,50,38,.26),
    0 0 0 1px rgba(88,77,58,.24);
  transition:transform .22s ease,box-shadow .22s ease;
}
.plot .pot::before{
  content:"";position:absolute;inset:7px;border-radius:50%;
  background-image:
    radial-gradient(circle at 25% 65%,rgba(255,240,210,.18) 0 1px,transparent 1.5px),
    radial-gradient(circle at 62% 38%,rgba(255,240,210,.12) 0 1px,transparent 1.5px),
    radial-gradient(circle at 38% 30%,rgba(143,109,76,.98) 0 30%,rgba(112,82,56,.98) 60%,#6A4E36 100%);
  background-size:15px 13px,19px 17px,auto;
  background-position:0 0,7px 5px,0 0;
  box-shadow:inset 0 4px 9px rgba(37,26,17,.42),inset 0 0 0 1px rgba(255,244,221,.16),inset 0 0 12px rgba(35,25,16,.30);
}
.plot .pot::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border-top:1px solid rgba(255,251,238,.62);
  border-left:1px solid rgba(255,251,238,.30);
  transform:rotate(-32deg);
}
.plot .pot-shadow{
  position:absolute;left:50%;top:86px;width:80px;height:12px;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 40%,rgba(65,55,40,.24),rgba(65,55,40,0) 70%);
  pointer-events:none;
}
.plant-svg{
  position:absolute;inset:0;width:100%;height:100%;z-index:2;
  transform:none;
  overflow:visible;pointer-events:none;
  filter:drop-shadow(0 2px 1px rgba(57,45,30,.10));
}
.plot .pot-grain{
  position:absolute;inset:6px;border-radius:50%;z-index:3;pointer-events:none;
  background:url("grain.png") repeat;background-size:34px;
  opacity:.55;mix-blend-mode:multiply;
}
.plot .tag{
  position:relative;z-index:2;margin-top:5px;padding:2px 3px 1px;
  text-align:center;line-height:1.2;
  background:linear-gradient(180deg,rgba(246,242,233,.80),rgba(246,242,233,.52));
}
.plot .tag b{display:block;font:400 10px/1.25 var(--serif);letter-spacing:.06em;color:var(--ink);white-space:nowrap}
.plot .tag i{display:block;margin-top:1px;font:600 6.5px/1.2 var(--sans);letter-spacing:.12em;color:var(--faint);font-style:normal;text-transform:uppercase;white-space:nowrap}
.plot .tag .ready{color:var(--terra)}
.plot.sel .pot{
  transform:translateY(-2px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 12px 18px -8px rgba(58,50,38,.36),
    0 0 0 1px rgba(88,77,58,.30),
    0 0 0 5px rgba(169,132,82,.20),
    0 0 0 6px rgba(169,132,82,.55);
}
.plot.sel .tag b{color:var(--ink)}
.plot.sel .no{color:var(--brass)}
.plot.ready .pot{box-shadow:0 0 0 1px rgba(88,77,58,.24),0 0 0 4px rgba(176,95,69,.12),0 8px 12px -6px rgba(58,50,38,.26)}
/* 空地 */
.plot.empty .plant-svg{opacity:.32}
.plot.empty .tag i{opacity:.65}
/* ---------- 底部 ---------- */
.folio{
  position:absolute;left:18px;right:18px;bottom:calc(126px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-between;align-items:center;
  font:600 6px/1 var(--sans);letter-spacing:.2em;color:rgba(43,43,36,.40);
  z-index:4;pointer-events:none;
}
.folio .hint{letter-spacing:.14em;font-weight:400;color:rgba(43,43,36,.48)}
.dock{
  position:absolute;left:0;right:0;bottom:0;z-index:6;
  height:calc(62px + env(safe-area-inset-bottom));
  padding:0 14px env(safe-area-inset-bottom);
  display:flex;align-items:center;
  background:linear-gradient(180deg,rgba(246,242,233,.82),rgba(241,237,227,.96) 38%,#F1EDE3);
  border-top:1px solid var(--line);
  backdrop-filter:blur(6px);
}
.dock .tool{
  flex:1;height:100%;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font:400 10px/1 var(--serif);letter-spacing:.12em;color:var(--muted);
}
.dock .tool .idx{font:600 6px/1 var(--sans);letter-spacing:.14em;color:rgba(43,43,36,.34)}
.dock .tool.on{color:var(--ink)}
.dock .tool.on::after{content:"";position:absolute;left:50%;bottom:8px;width:14px;height:1px;background:var(--brass);transform:translateX(-50%)}
.dock .tool.more{color:var(--terra)}

/* ---------- 档案页（日志 / 图鉴 / 工坊 / 装饰 / 成就 / 年报） ---------- */
.chapter{
  position:absolute;left:0;right:0;bottom:0;top:146px;z-index:9;
  display:none;overflow-y:auto;overscroll-behavior:contain;
  background:var(--paper);
  padding:16px 20px calc(26px + env(safe-area-inset-bottom));
}
.chapter.open{display:block}
.app.chapter-open .daily{display:none}
.app.chapter-open .garden,
.app.chapter-open .folio,
.app.chapter-open .dock{visibility:hidden}
.ch-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ch-head .kicker{display:block;font:600 6.5px/1 var(--sans);letter-spacing:.22em;color:var(--brass);text-transform:uppercase}
.ch-head h2{margin:5px 0 0;font:400 24px/1 var(--serif);letter-spacing:.06em}
.ch-head .count{font:600 6.5px/1.6 var(--sans);letter-spacing:.12em;color:var(--faint);text-align:right;white-space:nowrap}
.ch-sub{margin:9px 0 0;font:400 9px/1.6 var(--serif);color:var(--muted);letter-spacing:.04em}
.ch-section{margin-top:18px}
.ch-section h3{margin:0 0 6px;font:600 6.5px/1 var(--sans);letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
.jr{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.jr .date{width:40px;flex:0 0 40px;font:600 6.5px/1.5 var(--sans);letter-spacing:.08em;color:var(--brass)}
.jr .txt{flex:1;min-width:0}
.jr .txt b{display:block;font:400 11px/1.4 var(--serif);letter-spacing:.04em;color:var(--ink)}
.jr .txt span{display:block;margin-top:3px;font:400 8.5px/1.5 var(--sans);letter-spacing:.03em;color:var(--muted)}
.idx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.idx{border:1px solid var(--line-soft);background:rgba(255,252,244,.4);padding:8px 5px 7px;text-align:center}
.idx-art{position:relative;width:50px;height:50px;margin:0 auto 5px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 40% 32%,#8F6D4C 0 30%,#705238 60%,#6A4E36 100%);
  box-shadow:0 0 0 1px rgba(88,77,58,.25)}
.idx-art .plant-svg{position:absolute;inset:0;width:100%;height:100%}
.idx b{display:block;font:400 9.5px/1.3 var(--serif);letter-spacing:.05em;color:var(--ink)}
.idx i{display:block;margin-top:2px;font:600 5.5px/1.2 var(--sans);letter-spacing:.12em;color:var(--faint);font-style:normal;text-transform:uppercase}
.idx.locked{opacity:.86}
.idx.locked .plant-svg{filter:grayscale(.35) sepia(.06);opacity:.84}
.idx.locked b{color:var(--muted)}
.idx.rare{background:rgba(255,250,236,.62);border-color:rgba(169,132,82,.34)}
.idx.rare.locked{opacity:.96}
.idx.rare.locked .plant-svg{filter:grayscale(0) sepia(.06);opacity:.94}
.idx-tag{display:inline-block;margin-top:3px;padding:2px 4px 1px;border:1px solid rgba(169,132,82,.5);font:600 5px/1 var(--sans);letter-spacing:.16em;color:var(--brass)}
.idx-stats{display:flex;gap:16px;margin-top:12px;padding:9px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.idx-stats span{font:600 6.5px/1 var(--sans);letter-spacing:.12em;color:var(--muted)}
.idx-stats b{display:block;margin-bottom:4px;font:400 19px/1 var(--serif);letter-spacing:.04em;color:var(--ink)}
.idx-note{margin-top:7px;font:400 8px/1.6 var(--sans);color:var(--faint);letter-spacing:.03em}
.recipe{border:1px solid var(--line-soft);padding:11px 12px;margin-top:9px;background:rgba(255,252,244,.35)}
.recipe .rt{display:flex;justify-content:space-between;align-items:baseline}
.recipe b{font:400 13px/1.2 var(--serif);letter-spacing:.08em}
.recipe .state{font:600 6.5px/1 var(--sans);letter-spacing:.14em;color:var(--terra)}
.recipe p{margin:6px 0 0;font:400 8.5px/1.6 var(--sans);color:var(--muted)}
.recipe .need{margin-top:7px;font:600 6.5px/1.4 var(--sans);letter-spacing:.1em;color:var(--faint)}
.deco-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.deco-row .name{font:400 12px/1.3 var(--serif);letter-spacing:.05em}
.deco-row .sub{font:400 8px/1.4 var(--sans);color:var(--muted);margin-top:2px}
.deco-row .price{font:600 7px/1 var(--sans);letter-spacing:.08em;color:var(--brass);white-space:nowrap}
.mark{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.mark .badge{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:400 13px/1 var(--serif);color:var(--brass)}
.mark .mt b{display:block;font:400 11px/1.3 var(--serif);letter-spacing:.04em}
.mark .mt span{display:block;margin-top:2px;font:400 8px/1.4 var(--sans);color:var(--muted)}
.mark.locked{opacity:.5}
.annual-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:14px}
.annual-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 12px}
.annual-cell .k{font:600 6.5px/1 var(--sans);letter-spacing:.18em;color:var(--faint)}
.annual-cell .v{margin-top:8px;font:400 30px/1 var(--serif)}
.annual-cell .v small{font:600 7px/1 var(--sans);letter-spacing:.1em;color:var(--muted);margin-left:3px}
.ch-back{display:block;width:100%;margin-top:24px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:400 10px/1 var(--serif);letter-spacing:.16em;color:var(--terracotta)}


/* ---------- 3D 工具台 ---------- */
.tool-tray{
  position:absolute;left:0;right:0;bottom:0;z-index:6;
  height:calc(112px + env(safe-area-inset-bottom));
  display:flex;align-items:flex-end;justify-content:space-around;
  padding:0 16px calc(14px + env(safe-area-inset-bottom));
  pointer-events:none;
  background:linear-gradient(180deg,rgba(241,237,227,0),rgba(241,237,227,.52) 30%,rgba(232,226,214,.92) 100%);
}
.tool-tray::before{
  content:"";position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));
  height:16px;border-top:1px solid rgba(90,74,52,.42);
  background:linear-gradient(180deg,#D4C2A3,#B7A07B 45%,#8C7558 100%);
  box-shadow:0 1px 0 rgba(255,250,236,.6) inset,0 -2px 0 rgba(70,55,38,.16) inset,0 5px 10px rgba(55,44,30,.12);
}
.tool-tray::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#8B7558,#65523A);
}
.tray-hint{
  position:absolute;left:18px;top:7px;
  font:600 6px/1 var(--sans);letter-spacing:.2em;color:rgba(43,43,36,.38);
  pointer-events:none;
}
.tool-obj{
  pointer-events:auto;position:relative;width:76px;height:92px;
  cursor:grab;touch-action:none;z-index:2;
  filter:drop-shadow(0 6px 7px rgba(55,44,30,.18));
  transform-origin:50% 88%;transition:transform .18s ease,opacity .18s ease;
  -webkit-tap-highlight-color:transparent;
}
.tool-obj svg{width:100%;height:100%;display:block;overflow:visible}
.tool-obj:active{cursor:grabbing;transform:scale(.96)}
.tool-obj.dragging{opacity:.30}
.tool-no{
  position:absolute;left:0;right:0;bottom:0;text-align:center;
  font:600 6px/1 var(--sans);letter-spacing:.12em;color:rgba(43,43,36,.55);
  text-shadow:0 1px 0 rgba(255,250,236,.7);
}
.drag-aura{
  position:fixed;z-index:9998;width:156px;height:156px;pointer-events:none;
  transform:translate(-50%,-50%);border-radius:50%;opacity:.95;
}
.drag-aura::before,.drag-aura::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none}
.drag-aura::before{filter:blur(9px);animation:auraPulse 1.5s ease-in-out infinite}
.drag-aura::after{animation:auraRing 1.5s ease-out infinite}
.aura-water::before{background:radial-gradient(circle at 45% 40%,rgba(111,168,194,.52) 0 20%,rgba(126,174,196,.22) 48%,transparent 72%)}
.aura-water::after{

/* ---------- 标本抽屉 ---------- */

.dial-layer{

.hand::after{content:"";position:absolute;right:-3px;top:-3px;width:7px;height:7px;background:var(--brass);transform:rotate(45deg)}

  var specGrow = document.getElementById('specGrow');
  var specWater = document.getElementById('specWater');
  var specGrowBar = document.getElementById('specGrowBar');
  var specWaterBar = document.getElementById('specWaterBar');
  var specNote = document.getElementById('specNote');
  var specThumb = document.getElementById('specThumb');

  function plotEl(i){ return garden.querySelector('.plot[data-i="'+i+'"]'); }
  function select(i){
    selected = i;
    garden.querySelectorAll('.plot').forEach(function(el){el.classList.remove('sel');});
    plotEl(i).classList.add('sel');
  }
  function statusText(p){
    if(p.stage==='可收获') return '可收获';
    if(p.stage==='盛开') return '盛开';
    if(p.stage==='生长中') return '生长中';
    return p.stage;
  }
  function openSheet(i){
    if(typeof i==='number') select(i);
    var p = PLOTS[selected], t = THEME[p.type];
    specIdx.textContent = String(selected+1).padStart(3,'0');
    specName.textContent = p.name;
    specLatin.textContent = t.latin;
    specMeta.textContent = p.type==='empty' ? '空地 · 可以播种' : '普通花 · 春季 · 由我种植';
    specStatus.textContent = p.pests ? '需要驱虫' : statusText(p);
    specGrow.innerHTML = Math.round(p.grow)+'<small>%</small>';
    specWater.innerHTML = Math.round(p.water)+'<small>%</small>';
    specGrowBar.style.width = p.grow+'%';
    specWaterBar.style.width = p.water+'%';
    specNote.textContent = p.type==='empty' ? '这块地还空着。把种子袋拖进来，或点右侧小轮盘播种。' : (p.pests ? '叶片背面有虫。把驱虫喷雾拖到花盆上，或点右侧小轮盘处理。' : (p.ready ? '花开得正好。收获后，可以做成花束送给 TA。' : '还差一点。保持水分，等它慢慢长成。'));
    specThumb.innerHTML = '<span class="thumb-pot">'+plantSVG(p.type)+'</span>';
    sheet.classList.add('open'); sheetMask.classList.add('open');
    document.querySelectorAll('.plot').forEach(function(el){el.classList.remove('sel');});
    plotEl(selected).classList.add('sel');
  }
  function closeSheet(){
    sheet.classList.remove('open'); sheetMask.classList.remove('open');
    document.querySelectorAll('.plot').forEach(function(el){el.classList.remove('sel');});
  }
  garden.addEventListener('click', function(e){
    var b=e.target.closest('.plot'); if(!b) return;
    openSheet(+b.dataset.i);
  });
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  sheetMask.addEventListener('click', closeSheet);
  /* ---------- 工具、反馈与小轮盘 ---------- */
  var TOOL_LABEL = { water: '浇水', fertilize: '施肥', seed: '种植', spray: '驱虫', harvest: '收获', hybrid: '杂交' };
  var SEED_POOL = [
    { name: '玫瑰', type: 'rose' }, { name: '郁金香', type: 'tulip' },
    { name: '雏菊', type: 'jasmine' }, { name: '樱花', type: 'sakura' }
  ];

  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 1700);
  }
  function fx(i, kind) {
    var el = plotEl(i);
    if (!el) return;
    var s = document.createElement('span');
    s.className = 'fx fx-' + kind;
    el.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 820);
  }
  function applyTool(tool, i, opts) {
    opts = opts || {};
    var p = PLOTS[i];
    if (!p) return;
    var who = p.name;
    var ok = true;
    var fxKind = '';
    if (tool === 'water') {
      p.water = Math.min(100, p.water + 16);
      fxKind = 'water';
    } else if (tool === 'fertilize') {
      if (p.type === 'empty') { if (!opts.silent) toast('先种一株花再施肥'); return; }
      p.grow = Math.min(100, p.grow + 9);
      fxKind = 'fertilize';
    } else if (tool === 'spray') {
      if (!p.pests) { if (!opts.silent) toast('没有发现虫害'); return; }
      p.pests = false;
      fxKind = 'spray';
    } else if (tool === 'seed') {
      if (p.type !== 'empty') { if (!opts.silent) toast('这块地已经有花了'); return; }
      var s = SEED_POOL[Math.floor(Math.random() * SEED_POOL.length)];
      p.type = s.type;
      p.name = s.name;
      p.stage = '幼苗';
      p.grow = 8;
      p.water = 52;
      p.ready = false;
      fxKind = 'seed';
    } else if (tool === 'harvest') {
      if (!p.ready) { if (!opts.silent) toast('还没成熟，再等一等'); return; }
      p.type = 'empty';
      p.name = '空地';
      p.stage = '可种植';
      p.grow = 0;
      p.water = 44;
      p.ready = false;
      fxKind = 'seed';
    } else if (tool === 'hybrid') {
      if (!opts.silent) toast('先选另一株花，作为杂交对象（预览）');
      return;
    }
    renderGarden();
    select(selected);
    if (fxKind) fx(i, fxKind);
    if (sheet.classList.contains('open') && i === selected) openSheet(selected);
    if (!opts.silent && ok) toast(TOOL_LABEL[tool] + ' · ' + who);
  }

  /* 点花盆 → 弹窗；弹窗右侧小轮盘直接执行 */
  var MINI = [
    { id: 'water', label: '浇水', icon: '<path d="M12 3S6 10 6 14a6 6 0 0012 0c0-4-6-11-6-11z"/>' },
    { id: 'fertilize', label: '施肥', icon: '<path d="M12 21V9"/><path d="M12 14c-4 0-6-2-6-5 4 0 6 2 6 5z"/><path d="M12 11c4 0 6-2 6-5-4 0-6 2-6 5z"/><circle cx="8" cy="19" r=".7"/><circle cx="16" cy="19" r=".7"/>' },
    { id: 'harvest', label: '收获', icon: '<path d="M4 11h16l-2 8H6z"/><path d="M8 11V7a4 4 0 018 0v4"/><path d="M9 15h6"/>' },
    { id: 'seed', label: '种植', icon: '<path d="M12 21c0-6 3-9 8-9-1 6-3 9-8 9z"/><path d="M12 21c0-5-3-8-8-8 1 5 3 8 8 8z"/>' },
    { id: 'spray', label: '驱虫', icon: '<path d="M9 8h6v12H9z"/><path d="M10 8V5h4v3"/><path d="M15 11h6"/><path d="M17 8l3 2v3"/><circle cx="22" cy="7" r=".8"/><circle cx="20" cy="4" r=".6"/>' },
    { id: 'hybrid', label: '杂交', icon: '<circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/><path d="M12 7v10"/>' }
  ];
  function buildMiniWheel() {
    var w = document.getElementById('miniWheel');
    if (!w) return;
    var cx = 41, cy = 41, r = 28, n = MINI.length;
    var html = '<span class="mw-center">✦</span>';
    MINI.forEach(function (m, i) {
      var a = (-90 + i * 360 / n) * Math.PI / 180;
      var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      html += '<button type="button" class="mw-btn" data-act="' + m.id + '" title="' + m.label + '" aria-label="' + m.label + '" style="left:' + x + 'px;top:' + y + 'px;margin:-12.5px">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true">' + m.icon + '</svg></button>';
    });
    w.innerHTML = html;
    w.querySelectorAll('.mw-btn').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        applyTool(b.getAttribute('data-act'), selected);
      });
    });
  }
  buildMiniWheel();

  /* 3D 工具拖拽：经过的花盆逐个生效 */
  var dragTool = null;
  var toolLabel = function (t) { return TOOL_LABEL[t] || '工具'; };
  function startTool(e) {
    if (dragTool) return;
    e.preventDefault();
    var el = e.currentTarget;
    var ghost = el.cloneNode(true);
    ghost.classList.remove('dragging');
    ghost.classList.add('tool-ghost');
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
    document.body.appendChild(ghost);
    el.classList.add('dragging');
    var aura = document.createElement('div');
    aura.className = 'drag-aura aura-' + el.getAttribute('data-tool');
    aura.style.left = e.clientX + 'px';
    aura.style.top = e.clientY + 'px';
    document.body.appendChild(aura);
    dragTool = { tool: el.getAttribute('data-tool'), el: el, ghost: ghost, aura: aura, seen: {}, count: 0 };
    window.addEventListener('pointermove', moveTool);
    window.addEventListener('pointerup', endTool, { once: true });
    window.addEventListener('pointercancel', endTool, { once: true });
  }
  function moveTool(e) {
    if (!dragTool) return;
    dragTool.ghost.style.left = e.clientX + 'px';
    dragTool.ghost.style.top = e.clientY + 'px';
    if (dragTool.aura) { dragTool.aura.style.left = e.clientX + 'px'; dragTool.aura.style.top = e.clientY + 'px'; }
    var under = document.elementFromPoint(e.clientX, e.clientY);
    var plot = under && under.closest ? under.closest('.plot') : null;
    document.querySelectorAll('.plot.hover-tool').forEach(function (p) { p.classList.remove('hover-tool'); });
    if (!plot) return;
    var i = +plot.getAttribute('data-i');
    if (!dragTool.seen[i]) {
      dragTool.seen[i] = 1;
      dragTool.count++;
      applyTool(dragTool.tool, i, { silent: true, drag: true });
    }
    var fresh = plotEl(i);
    if (fresh) fresh.classList.add('hover-tool');
  }
  function endTool() {
    window.removeEventListener('pointermove', moveTool);
    document.querySelectorAll('.plot.hover-tool').forEach(function (p) { p.classList.remove('hover-tool'); });
    if (dragTool) {
      var t = dragTool.tool, c = dragTool.count;
      dragTool.ghost.remove();
      if (dragTool.aura) dragTool.aura.remove();
      dragTool.el.classList.remove('dragging');
      dragTool = null;
      if (c > 0) toast(toolLabel(t) + ' · ' + c + ' 块花圃');
      else toast('把' + toolLabel(t) + '拖到花盆上使用');
    }
  }
  document.querySelectorAll('.tool-obj').forEach(function (el) {
    el.addEventListener('pointerdown', startTool);
  });

  /* ---------- 档案页签 ---------- */
  var app = document.getElementById('app');
  var tabsEl = document.querySelector('.tabs');
  var chapter = document.getElementById('chapter');
  var CHAPTERS = {
    journal: {
      kicker: 'JOURNAL / 日志',
      title: '花园日志',
      count: '最近 7 天<br>12 条记录',
      sub: '每一次浇水、开花与收获，都按时间收在这里。',
      body: function () {
        var rows = [
          ['10/28', '收获「晨露玫瑰」3 枝', '完美品质 · 已送入工坊'],
          ['10/28', '给 6 块花圃浇了水', '土壤水分回到 82%'],
          ['10/27', '荷花第一次开花', '「并蒂」成就进度 1/3'],
          ['10/27', '杂交出「蓝月」', '飞燕草 × 玫瑰 · 新配方'],
          ['10/26', '完成今日打理', '连续 1 天 · +11 经验'],
          ['10/25', '山茶花进入生长期', '还差 13 小时成熟']
        ];
        return '<div class="ch-section"><h3>RECENT ENTRIES</h3>' + rows.map(function (r) {
          return '<div class="jr"><span class="date">' + r[0] + '</span><div class="txt"><b>' + r[1] + '</b><span>' + r[2] + '</span></div></div>';
        }).join('') + '</div>';
      }
    },
    dex: {
      kicker: 'INDEX / 图鉴',
      title: '花的图鉴',
      count: '已采集 11<br>共 32 种',
      sub: '19 种常见花与 13 种稀有花。花圃里种过的品种，会在图鉴里留下标本。',
      body: function () {
        var found = {};
        PLOTS.forEach(function (p) { if (p.type !== 'empty') found[p.type] = 1; });
        var got = Object.keys(found).length;
        var card = function (type) {
          var t = THEME[type];
          var rare = !!t.rare;
          var has = !!found[type];
          return '<div class="idx' + (rare ? ' rare' : '') + (has ? '' : ' locked') + '">' +
            '<div class="idx-art">' + plantSVG(type) + '</div>' +
            '<b>' + t.label + '</b>' +
            '<i>' + (has ? t.latin : (rare ? '稀有 · 待发现' : '未采集')) + '</i>' +
            (t.isNew ? '<span class="idx-tag">NEW</span>' : (rare ? '<span class="idx-tag">RARE</span>' : '')) +
          '</div>';
        };
        var common = SPECIES.filter(function (s) { return !THEME[s].rare; });
        var rare = SPECIES.filter(function (s) { return !!THEME[s].rare; });
        return '<div class="idx-stats">' +
            '<span><b>' + got + '</b>已采集</span>' +
            '<span><b>' + (SPECIES.length - got) + '</b>待发现</span>' +
            '<span><b>' + rare.length + '</b>稀有</span>' +
          '</div>' +
          '<div class="ch-section"><h3>COMMON / 常见 · ' + common.length + '</h3><div class="idx-grid">' + common.map(card).join('') + '</div></div>' +
          '<p class="idx-note">稀有花由两株常见花杂交或特殊种子获得；未采集的稀有品种只保留花型，采集后才补上拉丁名。</p>' +
          '<div class="ch-section"><h3>RARE / 稀有 · ' + rare.length + '</h3><div class="idx-grid">' + rare.map(card).join('') + '</div></div>';
      }
    },
    craft: {
      kicker: 'ATELIER / 工坊',
      title: '花艺工坊',
      count: '今日可做<br>2 束',
      sub: '把收下来的花做成花束，可以送进聊天。',
      body: function () {
        var rows = [
          ['初戀', '玫瑰 3 · 雏菊 2', '可制作', '已备齐 · 花香偏甜'],
          ['熱戀', '玫瑰 2 · 向日葵 1', '缺 1 枝', '缺向日葵 · 去花圃种一株'],
          ['思念', '薰衣草 3 · 樱花 1', '可制作', '已备齐 · 适合寄给远方的 TA']
        ];
        return '<div class="ch-section"><h3>RECIPES</h3>' + rows.map(function (r) {
          return '<div class="recipe"><div class="rt"><b>' + r[0] + '</b><span class="state">' + r[2] + '</span></div><p>' + r[3] + '</p><div class="need">' + r[1] + '</div></div>';
        }).join('') + '</div>';
      }
    },
    decor: {
      kicker: 'OBJECTS / 装饰',
      title: '花园物件',
      count: '已摆放 7 件',
      sub: '不改变数值，只让这一小片地方更像你的花园。',
      body: function () {
        var rows = [
          ['石灯', '夜间会在花圃边亮起', '已拥有'],
          ['铸铁长椅', '放在温室西侧，可坐', '已摆放'],
          ['月桂拱门', '跨在小径入口', '1,200 露'],
          ['鸟浴盆', '偶尔会有麻雀停留', '860 露']
        ];
        return '<div class="ch-section"><h3>COLLECTION</h3>' + rows.map(function (r) {
          return '<div class="deco-row"><div><div class="name">' + r[0] + '</div><div class="sub">' + r[1] + '</div></div><span class="price">' + r[2] + '</span></div>';
        }).join('') + '</div>';
      }
    },
    marks: {
      kicker: 'MARKS / 成就',
      title: '园丁的印记',
      count: '已解锁 5<br>共 24 枚',
      sub: '慢一点也没关系，花园会记得你做过的事。',
      body: function () {
        var rows = [
          ['满级园丁', '花园达到 Lv.10', '✓', false],
          ['晨露收藏家', '收获 30 枝带露水的花', '✓', false],
          ['杂交入门', '第一次成功杂交', '✓', false],
          ['万紫千红', '收集 20 种花', '◐', false],
          ['并蒂', '让一株荷花连续开花 3 次', '·', true],
          ['四季', '经历花园的四个季节', '·', true]
        ];
        return '<div class="ch-section"><h3>COLLECTION</h3>' + rows.map(function (r) {
          return '<div class="mark' + (r[3] ? ' locked' : '') + '"><span class="badge">' + r[2] + '</span><div class="mt"><b>' + r[0] + '</b><span>' + r[1] + '</span></div></div>';
        }).join('') + '</div>';
      }
    },
    annual: {
      kicker: 'ANNUAL / 年报',
      title: '这一年，花园',
      count: 'SPRING<br>2026',
      sub: '从第一颗种子，到现在这一片花圃。',
      body: function () {
        var cells = [['32', '种花'], ['37', '次收获'], ['23', '束花'], ['12', '块地']];
        return '<div class="annual-grid">' + cells.map(function (c) {
          return '<div class="annual-cell"><div class="k">' + c[1] + '</div><div class="v">' + c[0] + '<small>种</small></div></div>';
        }).join('') + '</div>' +
          '<div class="ch-section"><h3>FAVOURITE</h3><div class="jr"><span class="date">01</span><div class="txt"><b>晨露玫瑰</b><span>今年一共为你开了 9 次 · 最长的一次开了 4 天</span></div></div>' +
          '<div class="jr"><span class="date">02</span><div class="txt"><b>最安静的一天</b><span>10 月 22 日 · 你只来浇了一次水，但所有花都活着</span></div></div></div>';
      }
    }
  };

  function setTabActive(id) {
    Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (t) {
      t.classList.toggle('on', t.getAttribute('data-tab') === id);
    });
  }
  function closeChapter() {
    chapter.classList.remove('open');
    app.classList.remove('chapter-open');
    setTabActive('garden');
    chapter.innerHTML = '';
  }
  function openChapter(id) {
    var c = CHAPTERS[id];
    if (!c) return;
    setTabActive(id);
    app.classList.add('chapter-open');
    var tr = tabsEl.getBoundingClientRect();
    var ar = app.getBoundingClientRect();
    chapter.style.top = Math.round(tr.bottom - ar.top) + 'px';
    chapter.innerHTML = '<div class="ch-head"><div><span class="kicker">' + c.kicker + '</span><h2>' + c.title + '</h2></div><div class="count">' + c.count + '</div></div>' +
      '<p class="ch-sub">' + c.sub + '</p>' + c.body() + '<button class="ch-back" data-close>← 返回花圃</button>';
    chapter.classList.add('open');
    chapter.scrollTop = 0;
  }
  tabsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (!b) return;
    var id = b.getAttribute('data-tab');
    if (id === 'garden') closeChapter();
    else openChapter(id);
  });
  chapter.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) closeChapter();
  });
  var backBtn = document.querySelector('.back');
  if (backBtn) backBtn.addEventListener('click', function () {
    if (chapter.classList.contains('open')) closeChapter();
  });

  /* 预览直达：?state=sheet / ?state=dial */
  select(selected);
  var q = new URLSearchParams(location.search);
  if(q.get('state')==='sheet') setTimeout(function(){ openSheet(11); }, 60);
  if(q.get('tab') && CHAPTERS[q.get('tab')]) setTimeout(function(){ openChapter(q.get('tab')); }, 60);
  window.__gardenPreview = {openSheet:openSheet, closeSheet:closeSheet, select:select, applyTool:applyTool, plots:PLOTS};
})();
</script>
</body>
</html>
